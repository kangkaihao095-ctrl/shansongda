rules:
  - !SHARDING
    tables:
      t_order:
        actualDataNodes: ds$->{0..3}.t_order_$->{0..7}
        databaseStrategy:
          standard:
            shardingColumn: id
            shardingAlgorithmName: order-db-algo
        tableStrategy:
          standard:
            shardingColumn: id
            shardingAlgorithmName: order-table-algo
    shardingAlgorithms:
      order-db-algo:
        type: CLASS_BASED
        props:
          strategy: STANDARD
          algorithmClassName: com.shansuda.order.shard.OrderDatabaseShardingAlgorithm
      order-table-algo:
        type: CLASS_BASED
        props:
          strategy: STANDARD
          algorithmClassName: com.shansuda.order.shard.OrderTableShardingAlgorithm

props:
  sql-show: true
