<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <style>
    .steam { animation: rise 1.4s ease-in-out infinite; transform-origin: center; }
    .steam2 { animation-delay: .25s; }
    .steam3 { animation-delay: .5s; }
    .wobble { animation: wobble 1.1s ease-in-out infinite; transform-origin: 48px 62px; }
    @keyframes rise {
      0% { opacity: .15; transform: translateY(8px) scale(.8); }
      50% { opacity: .9; transform: translateY(-6px) scale(1); }
      100% { opacity: .15; transform: translateY(-16px) scale(.7); }
    }
    @keyframes wobble {
      0%,100% { transform: rotate(-6deg); }
      50% { transform: rotate(7deg); }
    }
  </style>
  <ellipse cx="48" cy="86" rx="22" ry="5" fill="rgba(26,18,8,.12)"/>
  <g class="steam" fill="none" stroke="#C9A227" stroke-width="3" stroke-linecap="round">
    <path d="M34 34c0-8 8-8 8-16"/>
  </g>
  <g class="steam steam2" fill="none" stroke="#E8C15A" stroke-width="3" stroke-linecap="round">
    <path d="M48 30c0-10 8-8 6-18"/>
  </g>
  <g class="steam steam3" fill="none" stroke="#C9A227" stroke-width="3" stroke-linecap="round">
    <path d="M62 34c0-8-6-8-4-16"/>
  </g>
  <g class="wobble">
    <rect x="22" y="52" width="52" height="18" rx="8" fill="#FF6A00" stroke="#1A1208" stroke-width="2.4"/>
    <rect x="26" y="46" width="44" height="10" rx="5" fill="#FFC300" stroke="#1A1208" stroke-width="2"/>
    <circle cx="48" cy="51" r="3" fill="#1A1208"/>
    <path d="M74 56h10" stroke="#1A1208" stroke-width="3" stroke-linecap="round"/>
    <path d="M18 68h60" stroke="#1A1208" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
